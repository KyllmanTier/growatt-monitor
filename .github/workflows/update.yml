name: Test Growatt API

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Test Growatt API
        env:
          GROWATT_TOKEN: ${{ secrets.GROWATT_TOKEN }}
          WIT_SN: ${{ secrets.GROWATT_WIT_SN }}
        run: python scripts/test_api.py

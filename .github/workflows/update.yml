name: Update battery data
 
on:
  schedule:
    # Toutes les 5 minutes. GitHub peut retarder un peu l'exécution
    # réelle en période de forte charge, c'est normal. Éviter de
    # descendre plus bas (1-2 min) pour ne pas re-déclencher le
    # système anti-robot de Growatt qui nous a déjà bloqués.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}  # permet de lancer manuellement depuis l'onglet Actions
 
permissions:
  contents: write
 
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Install dependencies
        run: pip install requests
 
      - name: Fetch battery data
        env:
          GROWATT_COOKIE: ${{ secrets.GROWATT_COOKIE }}
          PLANT_ID: ${{ secrets.GROWATT_PLANT_ID }}
          WIT_SN: ${{ secrets.GROWATT_WIT_SN }}
        run: python scripts/fetch_battery.py
 
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/battery.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update battery data"
          git push

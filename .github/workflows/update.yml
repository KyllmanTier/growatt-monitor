name: Update battery data

on:
  schedule:
    - cron: "*/10 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch battery data
        env:
          GROWATT_TOKEN: ${{ secrets.GROWATT_TOKEN }}
          GROWATT_WIT_SN: ${{ secrets.GROWATT_WIT_SN }}
        run: python scripts/fetch_battery.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/battery.json

          if git diff --staged --quiet; then
            echo "Aucun changement à enregistrer."
            exit 0
          fi

          git commit -m "Update battery data"

          git pull --rebase origin main

          git push origin main
